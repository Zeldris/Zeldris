<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Input goes to a deterministic engine that calculates the logic, then to a local AI that handles the experience. Private, auditable, no black boxes.">
<style>
.flow{fill:none;stroke:#0083C1;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 9;animation:d 1.6s linear infinite}
@keyframes d{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="20" y="40" width="170" height="150" rx="16" fill="#ffffff" stroke="#526272" stroke-width="2"/>
